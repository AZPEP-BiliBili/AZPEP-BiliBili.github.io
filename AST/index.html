<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZPEP SysRi Tool v2 - 一个简单、快捷、方便、免费、开源的系统重装工具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* 亮色主题变量 */
        :root {
            --primary-color: #409eff;
            --bg-color: #ffffff;
            --secondary-bg: #f5f7fa;
            --text-color: #333333;
            --text-secondary: #666666;
            --hover-color: #66b1ff;
            --border-color: #e4e7ed;
        }

        .mobile-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            z-index: 9999;
        }

        .desktop-container {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
        }

        header {
            width: 100%;
            padding: 1rem 5%;
            background: var(--secondary-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 999;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .logo span {
            color: var(--text-color);
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 2rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .hero {
            width: 100%;
            padding: 5rem 5%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 80vh;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin-bottom: 3rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(64, 158, 255, 0.3);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .screenshot-section {
            width: 100%;
            padding: 3rem 5%;
            background: var(--secondary-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screenshot-section h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .carousel-container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: white;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
        }

        .carousel-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-color);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .carousel-arrow:hover {
            background: var(--primary-color);
            color: white;
        }

        .arrow-left {
            left: 15px;
        }

        .arrow-right {
            right: 15px;
        }

        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .indicator-dot.active {
            background: var(--primary-color);
        }

        .video-section {
            width: 100%;
            padding: 5rem 5%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-section h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .video-container {
            max-width: 1200px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: white;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            width: 100%;
            padding: 2rem 5%;
            background: var(--secondary-bg);
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 767px) {
            .mobile-warning {
                display: flex;
            }
            .desktop-container {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-warning">
        <i class="fa fa-desktop fa-5x" style="color: var(--primary-color); margin-bottom: 2rem;"></i>
        <h2>AZPEP SysRi Tool v2</h2>
        <p style="margin-top: 1rem; font-size: 1.1rem;">本网站仅限电脑端访问，请使用电脑打开以获取完整体验</p>
    </div>

    <div class="desktop-container">
        <header>
            <div class="logo">AZPEP <span>SysRi Tool v2</span></div>
            <nav class="nav-links">
                <a href="#home">首页</a>
                <a href="#screenshot">界面展示</a>
                <a href="#video">软件展示</a>
                <a href="#download">下载</a>
                <a href="#github">开源仓库</a>
            </nav>
        </header>

        <section class="hero" id="home">
            <h1>AZPEP SysRi Tool v2</h1>
            <p>一个简单、快捷、方便、免费、开源的系统重装工具</p>
            <div class="btn-group" id="download">
                <a href="https://1812146689.share.123pan.cn/123pan/FQOrVv-yMk6d?pwd=3qvm#" class="btn btn-primary" target="_blank">
                    <i class="fa fa-download"></i> 立即下载
                </a>
                <a href="https://gitee.com/AZPEP_BiliBili/azpep-sys-ri-tool-v2" class="btn btn-secondary" id="github" target="_blank">
                    <i class="fa fa-github"></i> 开源仓库
                </a>
            </div>
        </section>

        <section class="screenshot-section" id="screenshot">
            <h2>软件界面展示</h2>
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="carousel-item">
                        <img src="image/MainProgram.png" alt="主界面" class="screenshot-img">
                    </div>
                    <div class="carousel-item">
                        <img src="image/Screenshot2.png" alt="功能界面1" class="screenshot-img">
                    </div>
                    <div class="carousel-item">
                        <img src="image/Screenshot3.png" alt="功能界面2" class="screenshot-img">
                    </div>
                    <div class="carousel-item">
                        <img src="image/Screenshot4.png" alt="功能界面3" class="screenshot-img">
                    </div>
                    <div class="carousel-item">
                        <img src="image/Screenshot5.png" alt="功能界面4" class="screenshot-img">
                    </div>
                </div>

                <button class="carousel-arrow arrow-left" id="prevBtn">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="carousel-arrow arrow-right" id="nextBtn">
                    <i class="fa fa-chevron-right"></i>
                </button>

                <div class="carousel-indicators" id="indicators">
                    <span class="indicator-dot active" data-index="0"></span>
                    <span class="indicator-dot" data-index="1"></span>
                    <span class="indicator-dot" data-index="2"></span>
                    <span class="indicator-dot" data-index="3"></span>
                </div>
            </div>
        </section>

        <section class="video-section" id="video">
            <h2>软件展示</h2>
            <iframe src="//player.bilibili.com/player.html?isOutside=true&aid=117113658283952&bvid=BV1D7bz6NEbW&cid=41010138382&p=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
        </section>

        <footer>
            <p>© 2026 AZPEP SysRi Tool v2 - 一个简单、快捷、方便、免费、开源的系统重装工具</p>
        </footer>
    </div>

    <script>
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });

        // 轮播逻辑
        const track = document.querySelector('.carousel-track');
        const items = document.querySelectorAll('.carousel-item');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicators = document.querySelectorAll('.indicator-dot');
        let currentIndex = 0;

        function updateCarousel() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            indicators.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
        }

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % items.length;
            updateCarousel();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            updateCarousel();
        });

        indicators.forEach((dot, i) => {
            dot.addEventListener('click', () => {
                currentIndex = i;
                updateCarousel();
            });
        });

        // 图片出错兜底
        document.querySelectorAll('.screenshot-img').forEach(img => {
            img.onerror = function () {
                this.src = 'https://via.placeholder.com/1200x675?text=截图加载失败';
            };
        });
    </script>
</body>
</html>
